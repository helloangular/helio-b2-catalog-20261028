# B2 (qa227): CROSS-REPOSITORY reusable body called from helio-b2-adoption-20261028 b2-reusable.yml (TC-221 unsupported-reusable).
name: b2-remote-body

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          echo "b2-reusable-body deploy to ${{ inputs.target }}"
          sleep "${{ vars.B2_TOPOLOGY_SLEEP || 10 }}"
